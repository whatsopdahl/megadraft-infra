name: Terraform Plan

# Runs terraform plan for both envs on every PR into main, using a
# read-only AWS role - lets reviewers see the diff before terraform-apply.yml
# auto-applies it to dev on merge.
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}-${{ matrix.environment }}
      cancel-in-progress: true
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        working-directory: envs/${{ matrix.environment }}
        run: terraform init

      - name: Terraform plan
        working-directory: envs/${{ matrix.environment }}
        run: terraform plan -input=false -var-file=${{ matrix.environment }}.tfvars
